services:
  postgres:
    image: postgres:18
    container_name: cda-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: chatondearu
    ports:
      - "5432:5432"
    volumes:
      # PG18+ moved PGDATA to /var/lib/postgresql/<major>/docker and the
      # declared VOLUME to /var/lib/postgresql — mount the parent accordingly.
      - cda_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d chatondearu"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  cda_postgres_data:
